<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Coordenadas del tablero</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #barra {
    position: sticky;
    top: 0;
    background: #333;
    padding: 10px;
    width: 100%;
    text-align: center;
    z-index: 10;
    box-sizing: border-box;
  }
  #barra button {
    padding: 6px 12px;
    margin: 0 4px;
    cursor: pointer;
    font-size: 14px;
  }
  #contador {
    display: inline-block;
    margin: 0 10px;
    font-weight: bold;
    color: #7cf;
  }
  #contenedor {
    position: relative;
    margin-top: 10px;
    cursor: crosshair;
  }
  #contenedor img {
    display: block;
    max-width: 95vw;
    user-select: none;
    pointer-events: none; /* los clics los capta el contenedor */
  }
  .marca {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    border: 2px solid yellow;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    font-size: 10px;
    color: white;
    text-align: center;
    line-height: 10px;
  }
  #salida {
    width: 90vw;
    height: 150px;
    margin: 20px 0;
    background: #111;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 8px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div id="barra">
  <strong>Hacé clic en orden:</strong>
  SALIDA → casillas 1..40 → LLEGADA
  &nbsp;|&nbsp;
  Cliqueados: <span id="contador">0</span> / 42
  &nbsp;
  <button id="deshacer">Deshacer último</button>
  <button id="reset">Reset</button>
  <button id="copiar">Copiar JSON</button>
</div>

<div id="contenedor">
  <img id="tablero" src="tablero.png" alt="Tablero">
</div>

<textarea id="salida" readonly></textarea>

<script>
const img = document.getElementById('tablero');
const contenedor = document.getElementById('contenedor');
const contador = document.getElementById('contador');
const salida = document.getElementById('salida');
const puntos = [];

function actualizar() {
  contador.textContent = puntos.length;
  salida.value = JSON.stringify(puntos, null, 2);
}

function marcar(clientX, clientY) {
  const rect = img.getBoundingClientRect();
  // Escalar a coordenadas originales de la imagen
  const x = Math.round((clientX - rect.left) * (img.naturalWidth / rect.width));
  const y = Math.round((clientY - rect.top) * (img.naturalHeight / rect.height));
  puntos.push({ x, y });

  // Marca visual en pantalla
  const marca = document.createElement('div');
  marca.className = 'marca';
  marca.style.left = (clientX - contenedor.getBoundingClientRect().left) + 'px';
  marca.style.top = (clientY - contenedor.getBoundingClientRect().top) + 'px';
  marca.textContent = puntos.length;
  contenedor.appendChild(marca);

  actualizar();
}

img.addEventListener('load', () => {
  // La imagen no recibe clics (pointer-events: none), los captamos en el contenedor
});

contenedor.addEventListener('click', (e) => {
  if (e.target.classList.contains('marca')) return;
  marcar(e.clientX, e.clientY);
});

document.getElementById('deshacer').addEventListener('click', () => {
  if (puntos.length === 0) return;
  puntos.pop();
  const marcas = contenedor.querySelectorAll('.marca');
  if (marcas.length) marcas[marcas.length - 1].remove();
  // Renumerar las marcas restantes
  contenedor.querySelectorAll('.marca').forEach((m, i) => m.textContent = i + 1);
  actualizar();
});

document.getElementById('reset').addEventListener('click', () => {
  puntos.length = 0;
  contenedor.querySelectorAll('.marca').forEach(m => m.remove());
  actualizar();
});

document.getElementById('copiar').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(salida.value);
    alert('JSON copiado al portapapeles');
  } catch {
    salida.select();
    document.execCommand('copy');
    alert('JSON copiado (fallback)');
  }
});
</script>

</body>
</html>
